    <style>
        :root {

            --orange: #f58220;

            --blue: #1677c8;

            --black: #000000;

            --green: #58b947;

            --ink: #0b1220;

            --muted: #5e6b7b;

            --line: #e7edf4;

            --soft: #f6f9fc;

            --white: #fff;

            --shadow: 0 20px 60px rgba(13, 32, 61, .10);

        }

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0
        }

        html {

            scroll-behavior: smooth
        }

        body {

            font-family: "DM Sans", sans-serif;

            color: var(--ink);

            background: #fff;

            line-height: 1.65
        }

        a {

            text-decoration: none;

            color: inherit
        }

        .container-fluid {

            width: min(1460px, 96%);

            margin: auto
        }

        /* ===== Our Clients logo wall ===== */
        #clients {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 8% 12%, rgba(245, 130, 32, .10), transparent 27%),
                radial-gradient(circle at 92% 80%, rgba(22, 119, 200, .07), transparent 28%),
                linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
        }

        #clients .section-head {
            max-width: 820px;
        }

        .clients-intro {
            max-width: 700px;
            margin: 0 auto;
            color: var(--muted);
            font-size: 16px;
        }

        .client-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 18px;
        }

        .client-logo-card {
            min-width: 0;
            min-height: 145px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            border: 1px solid #e7ebf0;
            border-radius: 18px;
            background: rgba(255, 255, 255, .94);
            box-shadow: 0 12px 30px rgba(13, 32, 61, .055);
            transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
        }

        .client-logo-card.client-alternate-bg {
            background: radial-gradient(circle at 12% 15%, rgba(22, 119, 200, .22), transparent 27%), radial-gradient(circle at 88% 18%, rgba(245, 130, 32, .16), transparent 25%), radial-gradient(circle at 50% 100%, rgba(88, 185, 71, .10), transparent 30%), linear-gradient(135deg, #07111f 0%, #0b1b2f 52%, #07131f 100%);
        }

        .client-logo-card:hover {
            transform: translateY(-5px);
            border-color: rgba(245, 130, 32, .4);
            box-shadow: 0 18px 38px rgba(13, 32, 61, .10);
        }

        .client-logo-card img {
            display: block;
            width: 100%;
            /* max-width: 175px; */
            height: 95px;
            object-fit: contain;
            object-position: center;
        }

        .clients-note {
            margin-top: 28px;
            text-align: center;
            color: #637186;
            font-size: 13px;
        }

        .clients-note strong {
            color: var(--ink);
        }

        .client-logo-card.d-lap-n {
            display: none;
        }

        @media (max-width: 1100px) {
            .client-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (max-width: 800px) {
            .client-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 14px;
            }

            .client-logo-card.d-lap-n {
                display: block;
            }
        }

        @media (max-width: 560px) {
            #clients .section-head {
                margin-bottom: 30px;
            }

            .client-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .client-logo-card {
                min-height: 112px;
                padding: 16px 12px;
                border-radius: 14px;
            }

            .client-logo-card img {
                /* max-width: 140px; */
                height: 75px;
            }

            .clients-note {
                line-height: 1.7;
            }

            .client-logo-card.d-lap-n {
                display: none;
            }

            .client-logo-card.d-lap-n.d-mob-b {
                display: block;
            }
        }
    </style>

    <script>
        // client section suffel on every refresh script code
        
        document.addEventListener("DOMContentLoaded", function () {
            const clientGrid = document.querySelector("#clients .client-grid");

            if (!clientGrid) return;

            // Get all client cards, including their background classes
            const clientCards = Array.from(
                clientGrid.querySelectorAll(".client-logo-card")
            );

            // Fisher-Yates shuffle algorithm
            for (let i = clientCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));

                [clientCards[i], clientCards[j]] =
                    [clientCards[j], clientCards[i]];
            }

            // Reinsert the complete cards in shuffled order
            const fragment = document.createDocumentFragment();

            clientCards.forEach(function (card) {
                fragment.appendChild(card);
            });

            clientGrid.appendChild(fragment);
        });

    </script>
